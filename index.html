<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline JSON Table Editor</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      background: #f6f7fb;
      color: #222;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1.2rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 0.4rem 0;
      font-size: 1.6rem;
    }
    .help {
      color: #555;
      margin-bottom: 1rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    button, input[type="file"], select {
      font: inherit;
    }
    button, select {
      border: 1px solid #c9d1e6;
      background: #f5f8ff;
      color: #1a3f8d;
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #e8efff;
    }
    .meta {
      margin-bottom: 0.8rem;
      border: 1px solid #dbe1ef;
      border-radius: 8px;
      padding: 0.8rem;
      background: #fbfcff;
    }
    .meta h2 {
      margin: 0 0 0.6rem 0;
      font-size: 1.05rem;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.6rem;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .meta-item input {
      border: 1px solid #d3dcf1;
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      font: inherit;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      border: 1px solid #dbe1ef;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #eef3ff;
    }
    td[contenteditable="true"] {
      background: #fcfdff;
      min-width: 120px;
    }
    tr:nth-child(even) td {
      background: #fafcff;
    }
    .row-actions {
      width: 80px;
      text-align: center;
    }
    .status {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: #2e5a1f;
      min-height: 1.1rem;
    }
    .status.error {
      color: #9e1c1c;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Offline JSON Table Editor</h1>
    <p class="help">Load your JSON object (like farm data), pick a section (farms/staff/attendance/expenses), edit rows in a table, and save the full updated JSON offline.</p>

    <div class="toolbar">
      <input type="file" id="jsonFileInput" accept="application/json,.json" />
      <label for="sectionSelect">Section:</label>
      <select id="sectionSelect" aria-label="Choose JSON array section"></select>
      <button id="addRowBtn" type="button">Add Row</button>
      <button id="downloadBtn" type="button">Download JSON</button>
      <button id="loadSampleBtn" type="button">Load Sample Data</button>
    </div>

    <section class="meta" id="metaSection">
      <h2>Top-level fields</h2>
      <div id="metaGrid" class="meta-grid"></div>
    </section>

    <table id="jsonTable" aria-label="JSON data table">
      <thead></thead>
      <tbody></tbody>
    </table>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
